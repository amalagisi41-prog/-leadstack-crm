# pnpm 10+ blocks dependency lifecycle (build) scripts by default for
# supply-chain safety. This is the approval list (the pnpm 11 home for
# what used to be package.json's "pnpm.onlyBuiltDependencies"). Setting a
# package to true lets its install script run. sharp's build is required
# so Next.js image optimization gets its native binary.
allowBuilds:
  '@firebase/util': true
  msw: true
  protobufjs: true
  re2: false
  sharp: true
  unrs-resolver: true

# Security: force patched versions of vulnerable transitive packages
# (firebase / firebase-admin / twilio / next pin older ranges).
overrides:
  "protobufjs@<7.6.1": "^7.6.1"
  "node-forge@<1.4.4": "^1.4.4"
  "axios@<1.21.1": "^1.21.1"
  "follow-redirects@<1.16.2": "^1.16.2"
  "form-data@>=4 <4.0.6": "^4.0.6"
  "form-data@<2.5.6": "^2.5.6"
  "@grpc/grpc-js@<1.14.5": "^1.14.5"
  "@fastify/busboy@<3.2.1": "^3.2.1"
  "fast-xml-parser@<5.5.6": "^5.5.6"
  "websocket-driver@<0.7.5": "^0.7.5"
  "brace-expansion@>=2 <2.1.6": "^2.1.6"
  "nanoid@>=3 <3.3.18": "^3.3.18"
  "postcss@<8.5.18": "^8.5.18"
  "source-map-js@<1.2.2": "^1.2.2"
  "sharp@<0.35.5": "^0.35.5"
  "@tiptap/core@<3.30.5": "^3.30.5"
  "prosemirror-view@<1.42.3": "^1.42.3"
  "happy-dom@<21.0.4": "^21.0.4"
  "browserslist@<4.28.7": "^4.28.7"
  "brace-expansion@<1.1.20": "^1.1.20"
  "brace-expansion@>=5 <5.0.11": "^5.0.11"
  "@tootallnate/once@<2.0.1": "^2.0.1"
  "uuid@<11.1.1": "^11.1.1"
  "qs@<6.16.1": "^6.16.1"
  "@babel/core@<7.29.1": "^7.29.1"
  "glob@>=9 <14.0.2": "^14.0.2"
  "minimatch@>=7 <11.0.1": "^11.0.1"
